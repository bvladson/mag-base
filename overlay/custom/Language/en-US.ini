widget.descriptions.implementation_intentions="Daily Intentions are a strategy for achieving goals by planning specific actions in advance, linking them to situational cues (e.g., “If situation X arises, then I will do Y”) to boost commitment and follow-through."
text.milestone_helper_content="Milestones are considered phases with a clear output. They have a start date, end date and represent a significant amount of work within the scope of your project. <br />While goals focus on metrics milestones focus on execution and outcomes. At the end of a milestone you should have something tangible you can present."
