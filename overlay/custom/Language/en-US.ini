text.get_organized_with_projects="We're excited to show you around and get your work organized.<br /><br />The system manages your work in "projects". The easiest way to define a project is to think about something <strong>you would like to accomplish</strong>. This can include metrics you'd like to reach, a client project or something you would like to create. Projects are then broken down into Goals with metrics and Milestones. <br /><br />"
