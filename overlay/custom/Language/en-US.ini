text.my_timesheets_helper_content="Timesheets are the place to track the actual hours worked on a To-Do.<br/>This is helpful for billing purpose but also to validate how well you are planning your tasks upfront.<br/>Overtime can adjust due dates to account for planning discrepencies."
text.show_projects_helper_content="<p>Projects are the heart of your business! Change, development, goals, and anything you can build or dream of will involve projects.<br/>Project management is simply the process of ensuring that your projects are delivered timely, correctly, and with real business value.<br/><br/>This is where your Projects will live. Your projects page will allow you to create a project, quickly see to do numbers, hours, budget dollars and the client associated with the project.<br/><br/>Use this page for a quick overview of all your projects.<br/><br/></p>"
text.new_db_version="A new version has been installed. To use the system you will need to update your database.<br/><br/><strong>Please make sure to backup your database before performing this update!</strong><br/>This may take a few minutes."
text.ical_export_description="Here you can create a unique calendar URL that will allow you to integrate your calendar in any application that supports the 'iCal' format. "
text.helpful_resources="Any new software can be daunting to learn, we strive to make the system as simple and straightforward as possible.<br />If you ever feel stuck or want to exchange ideas you can use the resources below to get help:"
