tooltip.link_milestones_tooltip="Marcos agrupam tarefas, definem uma data e funcionam como etapas no caminho para uma meta. Vincular um marco permite acompanhar seu progresso e ver como você está avançando."
checklist.timeline.tasks.createMilestones="Marcos agrupam tarefas, definem uma data e funcionam como etapas no caminho para uma meta. Crie de 3 a 5 marcos para cobrir aproximadamente 3 a 6 meses."
