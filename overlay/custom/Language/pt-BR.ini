text.get_organized_with_projects="Estamos animados para mostrar a plataforma e ajudar você a organizar seu trabalho.<br /><br />O sistema organiza seu trabalho em \"projetos\". A forma mais fácil de definir um projeto é pensar em algo <strong>que você deseja alcançar</strong>. Isso pode incluir métricas que você quer atingir, um projeto de cliente ou algo que você deseja criar. Depois, os projetos são divididos em Metas com métricas e Marcos. <br /><br />"
text.ical_title="Calendário MAG"
