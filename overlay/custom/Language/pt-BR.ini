email_notifications.password_reset_message="Recebemos seu e-mail solicitando redefinição da sua senha no sistema MAG.<br/><br/>Se você deseja redefinir sua senha, clique neste link:<br/><a href='%1$s' target='_blank' style='font-size: 14px;background: #A61915;display: inline-block;color: #fff;border-radius: 5px;padding: 3px 12px;text-decoration: none;'>Redefinir senha</a><br/><br/>Se você não solicitou redefinição de senha, ignore esta mensagem.<br/><br/>Obrigado."
