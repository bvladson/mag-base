text.ical.todo_start_alert="Uma tarefa está agendada para começar em breve"
widget.descriptions.implementation_intentions="Intenções Diárias são uma estratégia para atingir metas planejando ações específicas com antecedência e conectando-as a situações (ex.: “Se X acontecer, então farei Y”), aumentando comprometimento e execução."
text.milestone_helper_content="Marcos são fases com uma entrega clara. Eles têm data de início e fim e representam uma quantidade significativa de trabalho no escopo do projeto. <br />Enquanto metas focam em métricas, marcos focam em execução e resultados. Ao final de um marco, você deve ter algo tangível para apresentar."
