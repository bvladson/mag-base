headlines.welcome="Bem-vindo!"
headlines.welcome_to_leantime="Bem-vindo ao sistema MAG!"
text.welcome_to_leantime="Você foi convidado para colaborar em um projeto no sistema MAG. Antes de começar, crie sua senha."
text.here_are_news="Novidades dos seus projetos"
text.my_timesheets_helper_content="Registros de Horas é o lugar para manter o número real de horas trabalhadas numa Tarefa.<br/> O que facilita a cobrança mas também facilita a validar de antemão se o seu planejamento de tarefas funciona bem.<br/>Horas extras registradas no sistema podem ajudar as datas finais a contabilizar eventuais discrepâncias."
text.show_projects_helper_content="<p>Projetos são o coração do seu negócio! Mudança, desenvolvimento, objetivos, e qualquer coisa você pode construir ou sonhar envolvem projetos.<br/> Gestão de Projetos é simplesmente o processo de garantir que seus projetos são entregues a tempo, da forma correta, e com valor real de negócios.<br/><br/>Aqui é onde seus Projetos irão viver. A página dos seus projetos vai permitir criar um projeto, rapidamente ver números relacionados às tarefas, horas, orçamento e o cliente associado com o projeto.<br/><br/>Utilize esta página para uma rápida visão geral de todos seus projetos.<br/><br/></p>"
text.new_db_version="Uma nova versão foi instalada. Para usar o sistema você precisará atualizar seu banco de dados.<br/><br/><strong>Por favor tenha certeza de ter feito o backup do seu banco de dados antes de realizar esta atualização!</strong><br/>Levará alguns minutos."
text.ical_export_description="Aqui você pode criar uma URL de calendário exclusivo que permitirá integrar seu calendário do sistema em qualquer aplicativo que suporte o formato 'iCal'."
text.helpful_resources="Qualquer novo software pode ser assustador de aprender, nós nos esforçamos para tornar o sistema o mais simples e direto possível.<br />Se você se sentir preso ou quiser trocar ideias, você pode usar os recursos abaixo para obter ajuda:"
text.documentation="Nossa documentação detalha o uso do sistema, bem como alguns dos conceitos por trás desses recursos"
label.connect_calendar_description="Veja os eventos do seu calendário externo junto com suas tarefas e reuniões do sistema."
label.more_integrations_hint="Outras integrações de calendário poderão ser adicionadas ao sistema."
label.send_telemetry="Envio de dados anônimos de uso"
label.telemetry_background="O envio de dados de uso para fora da MAG está desativado neste servidor."
label.open_in_leantime="Abrir no sistema"
